<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">T.A.I.S 系统架构图</title>
  <desc id="desc">Trinity AI Security 工作台的前端、API、Agent 运行时与数据平台架构。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="55%" stop-color="#0b1e36"/>
      <stop offset="100%" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#7c8cff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="browser" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3957"/>
      <stop offset="100%" stop-color="#0a2541"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3261"/>
      <stop offset="100%" stop-color="#132752"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#342669"/>
      <stop offset="100%" stop-color="#251a52"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#124a4b"/>
      <stop offset="100%" stop-color="#0c3138"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000814" flood-opacity=".38"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#8fb4df" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4de4f6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5eead4"/>
    </marker>
    <style>
      .font { font-family: "Noto Sans CJK SC", "Noto Sans", Arial, sans-serif; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2.4px; }
      .title { font-size: 38px; font-weight: 800; letter-spacing: .4px; }
      .subtitle { font-size: 17px; font-weight: 400; }
      .groupTitle { font-size: 20px; font-weight: 800; }
      .groupMeta { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; }
      .cardTitle { font-size: 17px; font-weight: 700; }
      .cardText { font-size: 13px; font-weight: 400; }
      .small { font-size: 12px; font-weight: 600; }
      .arrowLabel { font-size: 12px; font-weight: 700; letter-spacing: .3px; }
    </style>
  </defs>

