[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# ``alembic/env.py`` always replaces this with Settings.postgres_sqlalchemy_url
# so connection secrets never live in this file.
sqlalchemy.url = postgresql+psycopg://localhost/tais

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
