[project]
name = "agno-aios"
version = "0.5.0"
description = "AI security operations center powered by FastAPI, Vue 3, Agno, and FastMCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "loguru>=0.7.3",
    "httpx>=0.24.0",
    "fastapi[standard]>=0.109.0",
    "uvicorn>=0.27.0",
    "polars>=1.36.0",
    "python-dotenv>=1.0.0",
    "agno>=2.4.3",
    "openai>=2.15.0",
    "fastmcp>=3.0.0b1",
    "sqlalchemy>=2.0.46",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "openinference-instrumentation-agno>=0.1.27",
    "tomli-w>=1.2.0",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "pyyaml>=6.0.3",
    "chromadb>=1.5.9",
]

[project.scripts]
update-cve = "api.tasks.update_cve:run"
update-ip-asset = "api.tasks.update_ip_asset:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["api"]
