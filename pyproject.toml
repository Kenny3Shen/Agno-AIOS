[project]
name = "agno-aios"
version = "0.6.0"
description = "AI security operations control plane powered by FastAPI, Vue, Agno, and FastMCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "loguru>=0.7.3",
    "httpx>=0.24.0",
    "fastapi[standard]>=0.109.0",
    "uvicorn>=0.27.0",
    "polars>=1.36.0",
    "python-dotenv>=1.0.0",
    "agno>=2.4.3",
    "openai>=2.15.0",
    "fastmcp>=3.0.0b1",
    "sqlalchemy>=2.0.46",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "openinference-instrumentation-agno>=0.1.27",
    "tomli-w>=1.2.0",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "pyyaml>=6.0.3",
    "pymysql>=1.2.0",
    "sentence-transformers>=3.0.0",
    "FlagEmbedding>=1.3.0",
    "torch>=2.12.1",
    "pgvector>=0.4.2",
    "psycopg>=3.3.4",
    "psycopg-pool>=3.3.1",
    "fastapi-users[oauth,sqlalchemy]>=14.0.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "unstructured>=0.23.1",
    "celery>=5.6.3",
]

[project.scripts]
update-cve = "api.tasks.update_cve:run"
update-ip-asset = "api.tasks.update_ip_asset:run"
migrate-mysql-to-postgres = "api.tasks.migrate_mysql_to_postgres:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
