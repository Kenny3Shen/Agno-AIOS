[project]
name = "T.A.I.S"
version = "0.6.0"
description = "AI security operations workspace powered by FastAPI, React, Agno, and FastMCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "httpx>=0.24.0",
    "fastapi[standard]>=0.109.0",
    "uvicorn>=0.27.0",
    "polars>=1.36.0",
    "python-dotenv>=1.0.0",
    "agno>=2.6.22",
    "openai>=2.15.0",
    "fastmcp>=3.4.3,<4",
    "sqlalchemy>=2.0.46",
    "openinference-instrumentation-agno>=0.1.27",
    "beautifulsoup4>=4.15.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=3.0.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "pgvector>=0.4.2",
    "psycopg>=3.3.4",
    "fastapi-users[oauth,sqlalchemy]>=14.0.0",
    "pydantic-settings>=2.0.0",
    "croniter>=6.2.3",
    "chonkie[code]>=1.6.8",
    "sse-starlette>=3.4.4",
    "cel-python>=0.5.0",
    "ddgs>=9.14.4",
    "docling>=2.113.0",
    "aiofiles>=25.1.0",
]

[project.scripts]
update-cve = "api.tasks.update_cve:run"
repair-trace-status = "api.tasks.repair_trace_status:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["api"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
# GTX 1070 Ti (Pascal sm_61) + WSL: use CUDA 12.4 wheels (driver reports CUDA 13.0).
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
